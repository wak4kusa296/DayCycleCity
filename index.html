<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本の時間に合わせた風景</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="info-panel">
            <h1>日本の時間に合わせた風景</h1>
            <div class="time-display">
                <p id="current-time"></p>
                <p id="time-period"></p>
            </div>
        </div>
        <div id="debug-panel" class="debug-panel" style="display: none;">
            <h2>デバッグモード</h2>
            <div class="debug-controls">
                <label for="debug-time-slider">時間: <span id="debug-time-display">00:00</span></label>
                <input type="range" id="debug-time-slider" min="0" max="1439" value="0" step="1">
            </div>
        </div>
        <div class="image-container">
            <img id="image-morning" class="scene-layer" src="img/Morning.png" alt="朝の風景">
            <img id="image-day" class="scene-layer" src="img/Day.PNG" alt="昼の風景">
            <img id="image-sunset" class="scene-layer" src="img/Sunset.png" alt="夕方の風景">
            <img id="image-night" class="scene-layer" src="img/Night.png" alt="夜の風景">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
